name: submission structure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base validator
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      - name: Check out candidate tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Validate pull request as inert data
        if: github.event_name == 'pull_request'
        run: >-
          python3 trusted/tools/validate_repository.py
          --base-tree trusted
          --candidate-tree candidate

      - name: Compile pull request dataset reproducibly
        if: github.event_name == 'pull_request'
        run: |
          if [[ -f trusted/tools/compile_dataset.py ]]; then
            python3 trusted/tools/compile_dataset.py --repository candidate --output "$RUNNER_TEMP/snapshot-a.json"
            python3 trusted/tools/compile_dataset.py --repository candidate --output "$RUNNER_TEMP/snapshot-b.json"
            cmp "$RUNNER_TEMP/snapshot-a.json" "$RUNNER_TEMP/snapshot-b.json"
          else
            echo "Trusted base predates the semantic compiler; push validation will bootstrap it."
          fi

      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate canonical repository
        if: github.event_name == 'push'
        run: python3 tools/validate_repository.py --repository .

      - name: Compile canonical dataset reproducibly
        if: github.event_name == 'push'
        run: |
          python3 tools/compile_dataset.py --repository . --output "$RUNNER_TEMP/snapshot-a.json"
          python3 tools/compile_dataset.py --repository . --output "$RUNNER_TEMP/snapshot-b.json"
          cmp "$RUNNER_TEMP/snapshot-a.json" "$RUNNER_TEMP/snapshot-b.json"

      - name: Run validator tests
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
